<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T0-5 속도 변경 동기화 측정</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background:#0f1115; color:#e8eaf0; padding:16px; max-width:720px; margin:0 auto; }
  h1 { font-size:18px; }
  .box { background:#181b22; border:1px solid #2e3340; border-radius:10px; padding:12px; margin-bottom:12px; }
  .ok { color:#3fb97a; } .bad { color:#e5484d; } .warn { color:#e8a33d; }
  button { font-size:18px; padding:14px 18px; border-radius:10px; border:none; background:#5b8cff; color:white; width:100%; margin-top:8px; }
  button:disabled { background:#2e3340; color:#9aa1b2; }
  select, input { font-size:16px; padding:8px; border-radius:8px; width:100%; margin-top:4px; }
  pre, textarea { white-space:pre-wrap; font-size:12px; background:#000; color:#9f9; padding:8px; border-radius:8px; max-height:300px; overflow:auto; }
  textarea { width:100%; height:180px; }
  .row { display:flex; gap:8px; align-items:center; }
</style>
</head>
<body>
  <h1>T0-5 — 속도 변경 동기화 측정 (REQ-04)</h1>

  <div class="box" id="featureBox">기능 감지 중...</div>

  <div class="box">
    <label>출력 장치 (지금 연결된 것을 고르고 측정 시작)</label>
    <select id="outputSelect">
      <option value="유선/스피커">유선/스피커</option>
      <option value="블루투스">블루투스 이어폰</option>
    </select>
    <label style="margin-top:8px;display:block">구간 길이(초) — 기본 180초(3분) x 4구간 = 약 12분</label>
    <input id="durationInput" type="number" value="180" min="10" max="300">
    <button id="startBtn">측정 시작 (버튼 1개 — 4구간 자동 진행)</button>
    <div id="progress" style="margin-top:8px"></div>
  </div>

  <div class="box">
    <div class="row"><b>결과 (복사해서 붙여넣으세요)</b></div>
    <textarea id="resultText" readonly placeholder="측정 결과가 여기 표시됩니다"></textarea>
  </div>

  <div class="box">
    <div class="row"><b>상세 로그</b></div>
    <pre id="log"></pre>
  </div>

<script type="module">
const PROCESSOR_URL = "https://cdn.jsdelivr.net/npm/@soundtouchjs/audio-worklet@2.1.1/.dist/soundtouch-processor.js";
const MODULE_URL = "https://cdn.jsdelivr.net/npm/@soundtouchjs/audio-worklet@2.1.1/.dist/index.js";

const logEl = document.getElementById("log");
const resultEl = document.getElementById("resultText");
const progressEl = document.getElementById("progress");
const featureBox = document.getElementById("featureBox");
const startBtn = document.getElementById("startBtn");

function log(msg) {
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}

function appendResult(line) {
  resultEl.value += line + "\n";
}

// ---- 1. 기능 감지 ----
function detectFeatures() {
  const lines = [];
  const secure = window.isSecureContext;
  lines.push(`보안 컨텍스트(HTTPS/localhost): <span class="${secure ? 'ok' : 'bad'}">${secure}</span>`);

  let audioWorkletOk = false;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    audioWorkletOk = !!ctx.audioWorklet;
    ctx.close();
  } catch (e) {
    lines.push(`AudioContext 생성 실패: ${e}`);
  }
  lines.push(`AudioWorklet 지원: <span class="${audioWorkletOk ? 'ok' : 'bad'}">${audioWorkletOk}</span>`);

  const wakeLockOk = "wakeLock" in navigator;
  lines.push(`Wake Lock 지원: <span class="${wakeLockOk ? 'ok' : 'bad'}">${wakeLockOk}</span>`);

  lines.push(`User Agent: <span style="font-size:11px">${navigator.userAgent}</span>`);
  lines.push(`<span class="warn">주의: iOS 무음(벨소리) 스위치가 켜져 있으면 Web Audio 소리가 안 들릴 수 있습니다(preservesPitch 후보는 영향 없음, SoundTouch 후보는 영향 있을 수 있음) — 무음 스위치를 꺼두고 테스트하세요.</span>`);

  featureBox.innerHTML = lines.join("<br>");
  return { secure, audioWorkletOk, wakeLockOk };
}
const features = detectFeatures();

// ---- 2. 테스트용 클릭 트랙 생성 (저작권 문제 없는 합성 오디오) ----
async function buildClickTrackBlobUrl(durationSec, sampleRate) {
  const offline = new OfflineAudioContext(1, Math.ceil(durationSec * sampleRate), sampleRate);
  for (let t = 0; t < durationSec; t += 1) {
    const osc = offline.createOscillator();
    const gain = offline.createGain();
    osc.frequency.value = (Math.floor(t) % 4 === 0) ? 1200 : 800; // 4박마다 강박
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.5, t + 0.005);
    gain.gain.linearRampToValueAtTime(0, t + 0.05);
    osc.connect(gain).connect(offline.destination);
    osc.start(t);
    osc.stop(t + 0.06);
  }
  const rendered = await offline.startRendering();
  const wavBlob = audioBufferToWav(rendered);
  return URL.createObjectURL(wavBlob);
}

function audioBufferToWav(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length * numChannels * 2 + 44;
  const bufferArr = new ArrayBuffer(length);
  const view = new DataView(bufferArr);
  function writeString(offset, s) { for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i)); }
  writeString(0, "RIFF"); view.setUint32(4, 36 + buffer.length * numChannels * 2, true);
  writeString(8, "WAVE"); writeString(12, "fmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * 2, true); view.setUint16(32, numChannels * 2, true);
  view.setUint16(34, 16, true); writeString(36, "data");
  view.setUint32(40, buffer.length * numChannels * 2, true);
  let offset = 44;
  const channelData = [];
  for (let c = 0; c < numChannels; c++) channelData.push(buffer.getChannelData(c));
  for (let i = 0; i < buffer.length; i++) {
    for (let c = 0; c < numChannels; c++) {
      const s = Math.max(-1, Math.min(1, channelData[c][i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      offset += 2;
    }
  }
  return new Blob([bufferArr], { type: "audio/wav" });
}

// ---- 3. 한 구간(후보 x 속도) 실행 ----
async function runOneSegment(ctx, label, tempo, durationSec, mode) {
  log(`--- ${label} (tempo=${tempo}, mode=${mode}) 시작 ---`);
  const blobUrl = await buildClickTrackBlobUrl(durationSec + 2, ctx.sampleRate);
  const audioEl = new Audio(blobUrl);
  audioEl.loop = false;

  let stNode = null;
  if (mode === "soundtouch") {
    const mod = await import(MODULE_URL);
    await mod.SoundTouchNode.register(ctx, PROCESSOR_URL);
    stNode = new mod.SoundTouchNode({ context: ctx });
    stNode.connect(ctx.destination);
    audioEl.preservesPitch = false;
    audioEl.playbackRate = tempo;
    const src = ctx.createMediaElementSource(audioEl);
    src.connect(stNode);
    stNode.playbackRate.value = tempo;
  } else {
    audioEl.preservesPitch = true;
    audioEl.playbackRate = tempo;
    const src = ctx.createMediaElementSource(audioEl);
    src.connect(ctx.destination);
  }

  const t0Audio = ctx.currentTime;
  await audioEl.play();
  const t0El = audioEl.currentTime;

  let maxDrift = 0;
  let samples = 0;
  const startWall = performance.now();
  return new Promise((resolve) => {
    const iv = setInterval(() => {
      const elapsedCtx = ctx.currentTime - t0Audio;
      const expected = elapsedCtx * tempo;
      const actual = audioEl.currentTime - t0El;
      const drift = (actual - expected) * 1000; // ms
      maxDrift = Math.max(maxDrift, Math.abs(drift));
      samples++;
      if ((performance.now() - startWall) / 1000 >= durationSec || audioEl.ended) {
        clearInterval(iv);
        audioEl.pause();
        if (stNode) stNode.disconnect();
        const finalDrift = drift;
        log(`--- ${label} 종료: 최종 어긋남=${finalDrift.toFixed(1)}ms, 최대 어긋남=${maxDrift.toFixed(1)}ms (표본 ${samples}개) ---`);
        resolve({ label, tempo, mode, finalDriftMs: finalDrift, maxDriftMs: maxDrift, samples });
      }
    }, 250);
  });
}

// ---- 4. 전체 실행 ----
startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  const outputLabel = document.getElementById("outputSelect").value;
  const durationSec = parseInt(document.getElementById("durationInput").value, 10) || 180;
  resultEl.value = "";
  appendResult(`T0-5 측정 결과 — ${new Date().toISOString()}`);
  appendResult(`출력: ${outputLabel} / UA: ${navigator.userAgent}`);
  appendResult(`보안컨텍스트=${features.secure} AudioWorklet=${features.audioWorkletOk} WakeLock=${features.wakeLockOk}`);
  appendResult("");

  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioCtx();
  await ctx.resume();

  const plan = [
    ["preservesPitch 60%", 0.6, "native"],
    ["preservesPitch 130%", 1.3, "native"],
    ["SoundTouch 60%", 0.6, "soundtouch"],
    ["SoundTouch 130%", 1.3, "soundtouch"],
  ];

  for (let i = 0; i < plan.length; i++) {
    progressEl.textContent = `진행: ${i + 1}/${plan.length} - ${plan[i][0]}`;
    try {
      const r = await runOneSegment(ctx, plan[i][0], plan[i][1], durationSec, plan[i][2]);
      appendResult(`[${r.label}] 최종=${r.finalDriftMs.toFixed(1)}ms 최대=${r.maxDriftMs.toFixed(1)}ms`);
    } catch (e) {
      log(`[오류] ${plan[i][0]}: ${e}`);
      appendResult(`[${plan[i][0]}] 실패: ${e} (다시 버튼을 누르면 재생 허용 팝업이 뜰 수 있습니다)`);
    }
  }
  progressEl.textContent = "완료";
  startBtn.disabled = false;
  await ctx.close();
});
</script>
</body>
</html>
